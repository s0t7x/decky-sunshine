name: Mutation testing

# What mutation testing is and how to read its number: tests/README.md. It
# reports rather than gates - minutes rather than seconds, and the number moves
# for reasons that are nobody's fault.
#
# Triggered by pushes that touch code rather than on a schedule: a scheduled run
# on an unchanged tree produces the same answer twice, GitHub disables cron
# workflows after 60 days of repository inactivity, and `paths` filters do not
# work with `schedule` at all. This way every result belongs to one commit.
on:
  push:
    branches: [main]
    # The code, the tests, and everything the two tools are installed and
    # configured from: an upgrade can break a run without a line of code
    # changing (under Vitest 5 nearly every mutant survives, and the run
    # reports no error). The release job's version bump in package.json starts no
    # run - pushes with the GITHUB_TOKEN never do.
    paths:
      - 'src/**'
      - 'py_modules/**'
      - 'main.py'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'stryker.config.json'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/mutation.yml'
      # Last, so that it wins over the lines above: the READMEs under tests/
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python:
    name: Python mutants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run mutants
        run: mutmut run

      - name: Report
        if: always()
        run: |
          {
            echo '## Python mutants'
            echo '```'
            mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend mutants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutants
        run: pnpm run mutation

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: .stryker-tmp/report.html
          if-no-files-found: ignore
